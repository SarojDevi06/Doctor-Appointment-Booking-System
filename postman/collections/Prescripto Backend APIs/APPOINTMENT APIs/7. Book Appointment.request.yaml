$kind: http-request
url: http://localhost:4000/api/appointment/book
method: POST
headers:
  token: "{{token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "doctorId": "{{doctorId}}",
      "date": "2026-09-28",
      "time": "10:00 AM",
      "amount": 500
    }
order: 1000
